name: Focos recentes (NASA FIRMS)
on:
  schedule:
    - cron: "17 * * * *"  # de hora em hora
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/focos_recentes.py
      - run: |
          git config user.name "focos-bot"
          git config user.email "focos-bot@users.noreply.github.com"
          git add public/data/recentes.js
          git diff --cached --quiet || (git commit -m "Atualiza focos recentes" && git push)
